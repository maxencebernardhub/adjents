name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # setup-uv no longer publishes floating major tags (since v8): pin the full version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        working-directory: backend

      - name: Lint with Ruff
        run: uv run ruff check .
        working-directory: backend

      - name: Check formatting with Ruff
        run: uv run ruff format --check .
        working-directory: backend

      - name: Typecheck with mypy
        run: uv run mypy --strict adjents/
        working-directory: backend

      - name: Run tests
        run: uv run pytest
        working-directory: backend

  frontend:
    name: Frontend — Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No `version` input: the pnpm version is read from `packageManager` in
      # frontend/package.json, so local and CI installs use the same pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Lint with ESLint
        run: pnpm lint
        working-directory: frontend

      - name: Check formatting with Prettier
        run: pnpm format:check
        working-directory: frontend

      - name: Typecheck with tsc
        run: pnpm typecheck
        working-directory: frontend

      - name: Run tests
        run: pnpm test --run
        working-directory: frontend
