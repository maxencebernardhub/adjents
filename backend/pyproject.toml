[project]
name = "adjents"
version = "0.1.0"
description = "AI agent platform for solopreneurs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "sqlmodel>=0.0.48",
    "anthropic>=2.1.0",
    "openai>=3.36.1",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "chromadb>=1.5.9",
    "python-dotenv>=1.2.4",
    "aiosqlite>=0.22.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
